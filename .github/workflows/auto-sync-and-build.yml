name: Sync fork, build DEBs, publish release

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:
    inputs:
      force_build:
        description: 'Build even when upstream has no new tag update'
        required: false
        default: 'false'
      ipa_url:
        description: 'Optional direct URL to a decrypted Spotify IPA for automatic IPA generation'
        required: false
        default: ''

permissions:
  contents: write

env:
  SWIFTPROTOBUF_VERSION: '1.29.0'
  THEOS: ${{ github.workspace }}/theos

jobs:
  sync:
    runs-on: ubuntu-latest
    outputs:
      build_needed: ${{ steps.check.outputs.build_needed }}
      tag_name: ${{ steps.check.outputs.tag_name }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/SideloadLabs/EeveeSpotifyReincarnated.git || true
          git remote set-url upstream https://github.com/SideloadLabs/EeveeSpotifyReincarnated.git
          git fetch upstream --tags
      - name: Calculate latest upstream tag
        id: check
        run: |
          set -e
          upstream_tag=$(git ls-remote --tags upstream | awk '{print $2}' | sed 's#refs/tags/##' | grep -v '{}' | sort -V | tail -n1 || true)
          local_tag=$(git tag --sort=-v:refname | head -n1 || true)
          echo "upstream_tag=$upstream_tag" >> $GITHUB_OUTPUT
          echo "local_tag=$local_tag" >> $GITHUB_OUTPUT
          if [ -z "$upstream_tag" ]; then
            echo "build_needed=false" >> $GITHUB_OUTPUT
            echo "tag_name=" >> $GITHUB_OUTPUT
            exit 0
          fi
          if [ "$upstream_tag" = "$local_tag" ] && [ "${{ github.event.inputs.force_build }}" != 'true' ]; then
            echo "build_needed=false" >> $GITHUB_OUTPUT
            echo "tag_name=$upstream_tag" >> $GITHUB_OUTPUT
            exit 0
          fi
          git checkout Master
          if ! git merge-base --is-ancestor HEAD upstream/Master; then
            echo "Your forked Master has diverged from upstream. Fix this manually." >&2
            exit 1
          fi
          git merge --ff-only upstream/Master
          git push origin Master
          git push origin --tags
          echo "build_needed=true" >> $GITHUB_OUTPUT
          echo "tag_name=$upstream_tag" >> $GITHUB_OUTPUT
  build:
    needs: sync
    if: needs.sync.outputs.build_needed == 'true'
    runs-on: macos-latest
    env:
      THEOS: ${{ github.workspace }}/theos
      SWIFTPROTOBUF_VERSION: '1.29.0'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - name: Checkout Theos
        uses: actions/checkout@v4
        with:
          repository: theos/theos
          path: ${{ github.workspace }}/theos
          submodules: recursive
      - name: Install build tools
        run: |
          brew install make dpkg ldid
          echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"
      - name: Build EeveeSwiftProtobuf.framework
        run: make build-eeveeswiftprotobuf
      - name: Build rootless DEB
        run: |
          make clean || true
          make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless
      - name: Find built package
        id: package
        run: |
          DEB_PATH=$(find packages -maxdepth 1 -name '*.deb' | head -n 1)
          if [ -z "$DEB_PATH" ]; then echo 'No .deb package found' >&2; exit 1; fi
          echo "deb_path=$DEB_PATH" >> $GITHUB_OUTPUT
          echo "deb_name=$(basename "$DEB_PATH")" >> $GITHUB_OUTPUT
      - name: Create or update release
        id: release
        uses: peter-evans/create-or-update-release@v4
        with:
          tag_name: ${{ needs.sync.outputs.tag_name }}
          name: ${{ needs.sync.outputs.tag_name }}
          draft: false
          prerelease: false
          body: |
            Automated build of EeveeSpotify packages from upstream fork sync.
      - name: Upload DEB to release
        uses: peter-evans/upload-release-asset@v3
        with:
          upload_url: ${{ steps.release.outputs.upload_url }}
          asset_path: ${{ steps.package.outputs.deb_path }}
          asset_name: ${{ steps.package.outputs.deb_name }}
          asset_content_type: application/vnd.debian.binary-package
      - name: Upload DEB artifact
        uses: actions/upload-artifact@v4
        with:
          name: EeveeSpotify-rootless-DEB
          path: ${{ steps.package.outputs.deb_path }}
      - name: Determine IPA source URL
        id: ipa_source
        run: |
          if [ -n '${{ github.event.inputs.ipa_url }}' ]; then
            echo "IPA_URL=${{ github.event.inputs.ipa_url }}" >> $GITHUB_OUTPUT
            echo "build_ipa=true" >> $GITHUB_OUTPUT
          elif [ -n '${{ secrets.VANILLA_IPA_URL }}' ]; then
            echo "IPA_URL=${{ secrets.VANILLA_IPA_URL }}" >> $GITHUB_OUTPUT
            echo "build_ipa=true" >> $GITHUB_OUTPUT
          else
            echo "build_ipa=false" >> $GITHUB_OUTPUT
          fi
      - name: Install IPA build tools
        if: steps.ipa_source.outputs.build_ipa == 'true'
        run: |
          brew install wget unzip zip
          echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"
          python3 -m pip install --upgrade --break-system-packages git+https://github.com/asdfzxcvbn/pyzule-rw.git
          ARCH=$(uname -m)
          if [ "$ARCH" = "x86_64" ]; then
            SUFFIX=macos-amd64
          else
            SUFFIX=macos-arm64
          fi
          sudo curl -fsSL "https://github.com/asdfzxcvbn/ipapatch/releases/latest/download/ipapatch.${SUFFIX}" -o /usr/local/bin/ipapatch
          sudo chmod +x /usr/local/bin/ipapatch
      - name: Download decrypted Spotify IPA
        if: steps.ipa_source.outputs.build_ipa == 'true'
        run: |
          curl -fsSL "$IPA_URL" -o spotify.ipa
      - name: Build IPA
        if: steps.ipa_source.outputs.build_ipa == 'true'
        run: |
          chmod +x ./build-ipa-local.sh
          ./build-ipa-local.sh spotify.ipa
      - name: Upload IPA assets to release
        if: steps.ipa_source.outputs.build_ipa == 'true'
        run: |
          upload_url='${{ steps.release.outputs.upload_url }}'
          upload_url="${upload_url%\{*}"
          for ipa in Outputs/IPAS/*.ipa; do
            [ -f "$ipa" ] || continue
            name=$(basename "$ipa")
            curl -fsSL -H "Authorization: token $GITHUB_TOKEN" \
              -H "Content-Type: application/octet-stream" \
              --data-binary @"$ipa" "${upload_url}?name=$name"
          done
