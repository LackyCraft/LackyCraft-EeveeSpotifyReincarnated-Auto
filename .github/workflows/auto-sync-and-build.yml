name: Auto Sync and Build Release

on:
  workflow_dispatch:
    inputs:
      force_build:
        description: 'Build even if upstream has no new tag'
        required: false
        default: 'false'
      ipa_url:
        description: 'Override: direct URL to a decrypted Spotify IPA (defaults to the VANILLA_IPA_URL secret)'
        required: false
        default: ''
  push:
    paths:
      - '.github/ci-trigger-sync.txt'
  schedule:
    - cron: '0 3 * * *'

permissions:
  contents: write

concurrency:
  group: auto-sync-and-build
  cancel-in-progress: true

env:
  SWIFTPROTOBUF_VERSION: '1.29.0'
  THEOS: ${{ github.workspace }}/theos

jobs:
  sync:
    name: Sync fork with upstream
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ steps.determine.outputs.tag_name }}
      build_needed: ${{ steps.determine.outputs.build_needed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Add upstream and fetch
        run: |
          git remote add upstream https://github.com/SideloadLabs/EeveeSpotifyReincarnated.git
          # --force: upstream is authoritative for its own tags. Without it, a tag
          # that got created locally under the same name (e.g. by softprops/action-gh-release
          # on a previous run, pointing at our own commit rather than upstream's) makes the
          # fetch fail with "would clobber existing tag" and blocks every future sync.
          git fetch --force --tags upstream

      - id: determine
        name: Determine build necessity and sync
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -e
          upstream_tag=$(git ls-remote --tags upstream | awk '{print $2}' | sed 's#refs/tags/##' | grep -v '{}' | sort -V | tail -n1)
          echo "upstream tag: $upstream_tag"

          if [ -z "$upstream_tag" ]; then
            echo "tag_name=" >> "$GITHUB_OUTPUT"
            echo "build_needed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "tag_name=$upstream_tag" >> "$GITHUB_OUTPUT"

          # A release already published for this tag means we've already built it.
          release_status=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: token $GH_TOKEN" \
            "https://api.github.com/repos/$GH_REPO/releases/tags/$upstream_tag")
          echo "release status for $upstream_tag: $release_status"

          if [ "$release_status" = "200" ] && [ "${{ github.event.inputs.force_build }}" != 'true' ]; then
            echo "build_needed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "build_needed=true" >> "$GITHUB_OUTPUT"
          git checkout Master
          if ! git merge --ff-only upstream/Master; then
            echo "::error::Fork's Master has diverged from upstream/Master and can't be fast-forwarded. Resolve manually."
            exit 1
          fi
          git remote set-url origin "https://x-access-token:${{ secrets.GH_PAT }}@github.com/${{ github.repository }}.git"
          git push origin Master

  build:
    name: Build DEB and IPA, publish release
    needs: sync
    if: needs.sync.outputs.build_needed == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Checkout Theos
        uses: actions/checkout@v5
        with:
          repository: theos/theos
          path: ${{ github.workspace }}/theos
          submodules: recursive

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.3.0'

      - name: Install build tools
        run: |
          brew install make dpkg ldid wget unzip zip jq
          echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"
          python3 -m pip install --upgrade --break-system-packages git+https://github.com/asdfzxcvbn/pyzule-rw.git
          ARCH=$(uname -m)
          if [ "$ARCH" = "x86_64" ]; then SUFFIX=macos-amd64; else SUFFIX=macos-arm64; fi
          sudo curl -fsSL "https://github.com/asdfzxcvbn/ipapatch/releases/latest/download/ipapatch.${SUFFIX}" -o /usr/local/bin/ipapatch
          sudo chmod +x /usr/local/bin/ipapatch

      - name: Install ClamAV
        run: |
          brew install clamav
          conf="$(brew --prefix)/etc/clamav/freshclam.conf"
          [ -f "$conf" ] || cp "${conf}.sample" "$conf"
          sed -i '' '/^Example/d' "$conf"
          freshclam || echo "::warning::freshclam failed to update ClamAV definitions; scan may use stale/bundled data"

      - id: ipa_source
        name: Determine IPA source
        run: |
          if [ -n "${{ github.event.inputs.ipa_url }}" ]; then
            echo "url=${{ github.event.inputs.ipa_url }}" >> "$GITHUB_OUTPUT"
            echo "build_ipa=true" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ secrets.VANILLA_IPA_URL }}" ]; then
            echo "url=${{ secrets.VANILLA_IPA_URL }}" >> "$GITHUB_OUTPUT"
            echo "build_ipa=true" >> "$GITHUB_OUTPUT"
          else
            echo "build_ipa=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download vanilla IPA
        if: steps.ipa_source.outputs.build_ipa == 'true'
        env:
          IPA_URL: ${{ steps.ipa_source.outputs.url }}
        run: |
          curl -fsSL "$IPA_URL" -o spotify.ipa
          file_type=$(file --mime-type -b spotify.ipa)
          if [[ "$file_type" != "application/x-ios-app" && "$file_type" != "application/zip" ]]; then
            echo "::error::VANILLA_IPA_URL / ipa_url did not return a valid IPA file (got $file_type). Check the URL is a direct download link, not a webpage."
            exit 1
          fi

      - id: prepatch_scan
        name: Scan downloaded IPA (pre-patch)
        if: steps.ipa_source.outputs.build_ipa == 'true'
        env:
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
        run: |
          mkdir -p reports
          chmod +x Tools/scan-report.sh
          set +e
          ./Tools/scan-report.sh "vanilla IPA (before patch)" reports/prepatch-scan.md spotify.ipa
          status=$?
          set -e
          [ "$status" -eq 2 ] && echo "critical=true" >> "$GITHUB_OUTPUT" || echo "critical=false" >> "$GITHUB_OUTPUT"

      - id: ipa_check
        name: Check if vanilla IPA is decrypted
        if: steps.ipa_source.outputs.build_ipa == 'true'
        run: |
          rm -rf ipa_check && mkdir -p ipa_check
          unzip -q spotify.ipa -d ipa_check
          APP_DIR=$(find ipa_check/Payload -maxdepth 1 -name '*.app' | head -n1)
          EXEC_NAME=$(plutil -extract CFBundleExecutable raw "$APP_DIR/Info.plist")
          CRYPTID=$(otool -l "$APP_DIR/$EXEC_NAME" | awk '/LC_ENCRYPTION_INFO/{f=1} f && /cryptid/{print $2; exit}')
          rm -rf ipa_check
          echo "IPA cryptid: ${CRYPTID:-unknown}"
          if [ "$CRYPTID" = "0" ]; then
            echo "decrypted=true" >> "$GITHUB_OUTPUT"
          else
            echo "decrypted=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build DEB + IPA
        if: steps.ipa_source.outputs.build_ipa == 'true' && steps.ipa_check.outputs.decrypted == 'true'
        run: |
          chmod +x ./build-ipa-local.sh
          ./build-ipa-local.sh spotify.ipa

      - name: Build DEB only (no usable IPA source)
        if: steps.ipa_source.outputs.build_ipa != 'true' || steps.ipa_check.outputs.decrypted != 'true'
        run: |
          make build-eeveeswiftprotobuf
          make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless

      - id: outputs
        name: Collect build outputs
        run: |
          mkdir -p output
          deb=$(find packages -maxdepth 1 -name '*.deb' | head -n1)
          if [ -n "$deb" ]; then cp "$deb" output/; fi
          ipa=$(find Outputs/IPAS -maxdepth 1 -name '*.ipa' 2>/dev/null | head -n1)
          if [ -n "$ipa" ]; then cp "$ipa" output/; fi
          ls -la output
          if [ -z "$(ls -A output)" ]; then
            echo "::error::No build artifacts were produced (neither .deb nor .ipa)"
            exit 1
          fi
          if [ -n "$ipa" ]; then
            echo "ipa_included=true" >> "$GITHUB_OUTPUT"
          else
            echo "ipa_included=false" >> "$GITHUB_OUTPUT"
          fi

      - id: postpatch_scan
        name: Scan build outputs (post-patch)
        env:
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
        run: |
          mkdir -p reports
          chmod +x Tools/scan-report.sh
          set +e
          ./Tools/scan-report.sh "build output (after patch)" reports/postpatch-scan.md output/*
          status=$?
          set -e
          [ "$status" -eq 2 ] && echo "critical=true" >> "$GITHUB_OUTPUT" || echo "critical=false" >> "$GITHUB_OUTPUT"

      - name: Compose release notes
        run: |
          {
            echo "Automated build of EeveeSpotify packages from upstream fork sync."
            echo
            if [ "${{ steps.outputs.outputs.ipa_included }}" = "true" ]; then
              echo "Includes .deb and .ipa."
            else
              echo "Only .deb is included - VANILLA_IPA_URL points to an encrypted (FairPlay DRM) IPA, and patching requires an already-decrypted one. Update the secret with a decrypted IPA and re-run the workflow to also get an .ipa."
            fi
            echo
            if [ "${{ steps.prepatch_scan.outputs.critical }}" = "true" ] || [ "${{ steps.postpatch_scan.outputs.critical }}" = "true" ]; then
              echo "## ⚠️ SECURITY WARNING"
              echo "Antivirus scanning flagged one or more files in this build as malicious/suspicious."
              echo "**Do not install until you've reviewed the attached scan reports.**"
              echo
            fi
            echo "Antivirus scan reports (ClamAV + VirusTotal, before and after patching) are attached below."
          } > release-body.md
          cat release-body.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build outputs as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: EeveeSpotify-build-${{ github.run_id }}
          path: |
            output/*
            reports/*.md
          if-no-files-found: error

      - name: Publish release with all built files
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.sync.outputs.tag_name != '' && needs.sync.outputs.tag_name || format('autosync-{0}', github.run_id) }}
          name: ${{ needs.sync.outputs.tag_name != '' && needs.sync.outputs.tag_name || format('Autosync {0}', github.run_id) }}
          body_path: release-body.md
          draft: false
          prerelease: false
          files: |
            output/*
            reports/*.md
