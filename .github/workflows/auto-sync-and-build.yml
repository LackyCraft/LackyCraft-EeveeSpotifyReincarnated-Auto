name: Auto Sync and Build Release (simplified)

on:
  workflow_dispatch: {}
  push:
    paths:
      - '.github/ci-trigger-sync.txt'
  schedule:
    - cron: '0 3 * * *'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ steps.determine.outputs.tag_name }}
      build_needed: ${{ steps.determine.outputs.build_needed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Add upstream and fetch
        run: |
          git remote add upstream https://github.com/SideloadLabs/EeveeSpotifyReincarnated.git || true
          git fetch --tags upstream || true
          git fetch --tags origin || true

      - id: determine
        name: Determine build necessity
        run: |
          set -e
          upstream_tag=$(git ls-remote --tags upstream | awk -F'/' '/refs\/tags\//{print $2}' | sed 's/\^{}//' | sort -V | tail -n1 || true)
          origin_tag=$(git ls-remote --tags origin | awk -F'/' '/refs\/tags\//{print $2}' | sed 's/\^{}//' | sort -V | tail -n1 || true)
          echo "upstream=$upstream_tag"
          echo "origin=$origin_tag"
          if [ -n "$upstream_tag" ] && [ "$upstream_tag" != "$origin_tag" ]; then
            echo "tag_name=$upstream_tag" >> "$GITHUB_OUTPUT"
            echo "build_needed=true" >> "$GITHUB_OUTPUT"
            if git show-ref --verify --quiet refs/heads/Master; then git checkout Master || true; else git checkout -b Master || true; fi
            git fetch upstream || true
            git merge --ff-only upstream/Master || git merge --ff-only upstream/main || true
            git remote set-url origin https://x-access-token:${{ secrets.GH_PAT }}@github.com/${{ github.repository }}.git
            git push origin HEAD:Master || true
          else
            echo "tag_name=" >> "$GITHUB_OUTPUT"
            echo "build_needed=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: sync
    runs-on: macos-latest
    if: needs.sync.outputs.build_needed == 'true' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install build tools
        run: |
          brew update || true
          brew install dpkg ldid wget unzip zip python3 || true

      - name: Install Theos
        run: |
          if [ ! -d "$HOME/theos" ]; then git clone --depth=1 https://github.com/theos/theos "$HOME/theos"; fi
          export THEOS="$HOME/theos"

      - name: Build DEB
        run: |
          set -e
          export THEOS="$HOME/theos"
          if [ -f Makefile ]; then make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless || true; fi
          debfile=$(find . -type f -name "*.deb" | head -n1 || true)
          mkdir -p output
          if [ -n "$debfile" ]; then cp "$debfile" output/; fi
          ls -la output || true

      - name: Create release + upload assets (shell)
        env:
          GH_REPO: ${{ github.repository }}
          GH_OWNER: ${{ github.repository_owner }}
          GH_PAT: ${{ secrets.GH_PAT }}
          TAG: ${{ needs.sync.outputs.tag_name }}
        run: |
          set -e
          if [ -z "$TAG" ]; then TAG="autosync-$GITHUB_RUN_ID"; fi
          echo "Using tag: $TAG"

          # Create release via API
          payload=$(jq -n --arg t "$TAG" --arg n "$TAG" '{ tag_name: $t, name: $n, body: "Automated build", draft: false, prerelease: false }')
          rel=$(curl -s -X POST -H "Authorization: token $GH_PAT" -H "Accept: application/vnd.github+json" -d "$payload" "https://api.github.com/repos/$GH_REPO/releases")
          upload_url=$(echo "$rel" | jq -r .upload_url)
          if [ "$upload_url" = "null" ] || [ -z "$upload_url" ]; then
            echo "Failed to create release: $rel" >&2
            exit 1
          fi
          # normalize upload_url
          upload_url="${upload_url%\{*}"

          # Upload DEB(s)
          for f in output/*.deb; do
            [ -f "$f" ] || continue
            name=$(basename "$f")
            echo "Uploading $f as $name"
            curl -s -X POST -H "Authorization: token $GH_PAT" -H "Content-Type: application/octet-stream" --data-binary @"$f" "$upload_url?name=$name"
          done

          # If VANILLA_IPA_URL secret available, download and build IPA
          if [ -n "${{ secrets.VANILLA_IPA_URL }}" ]; then
            echo "VANILLA_IPA_URL provided, downloading"
            mkdir -p vanilla
            curl -L -o vanilla/vanilla.ipa "${{ secrets.VANILLA_IPA_URL }}"
            chmod +x ./build-ipa-local.sh || true
            ./build-ipa-local.sh vanilla/vanilla.ipa output/app.ipa || true
            for f in output/*.ipa; do
              [ -f "$f" ] || continue
              name=$(basename "$f")
              echo "Uploading $f as $name"
              curl -s -X POST -H "Authorization: token $GH_PAT" -H "Content-Type: application/octet-stream" --data-binary @"$f" "$upload_url?name=$name"
            done
          else
            echo "No VANILLA_IPA_URL secret set; skipping IPA build"
          fi

      - name: Upload outputs as artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: output/
